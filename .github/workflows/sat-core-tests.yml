name: SAT core, W4 analysis and full correctness tests

on:
  push:
    branches:
      - p2/w4-sat
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/sat-core-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/sat-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sat-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    name: SAT core and W4 analysis (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest ortools==9.15.6755 python-sat==1.9.dev15
      - name: Run SAT, triage and pilot-analysis tests
        run: python -m pytest tests/sat tests/experiments/test_analyze_rq1_rq2.py tests/experiments/test_pilot_scripts.py -q

  full-test-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: Full correctness suite (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest tests -q
