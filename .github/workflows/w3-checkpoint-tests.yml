name: W3 checkpoint, runner and HB loader tests

on:
  push:
    branches:
      - p1/w3-experimental-protocol-rc
    paths:
      - "src/common/checkpoint.py"
      - "src/sat/loader.py"
      - "src/sat/solve.py"
      - "src/runner/**"
      - "tests/runner/**"
      - "tests/sat/test_hb_loader.py"
      - "experiments/pilot_exact_p1.py"
      - "tests/experiments/test_pilot_exact_p1.py"
      - ".github/workflows/w3-checkpoint-tests.yml"
  pull_request:
    paths:
      - "src/common/checkpoint.py"
      - "src/sat/loader.py"
      - "src/sat/solve.py"
      - "src/runner/**"
      - "tests/runner/**"
      - "tests/sat/test_hb_loader.py"
      - "experiments/pilot_exact_p1.py"
      - "tests/experiments/test_pilot_exact_p1.py"
      - ".github/workflows/w3-checkpoint-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-runner-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    name: Runner and HB loader tests (${{ matrix.os }})
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài phụ thuộc tối thiểu
        run: python -m pip install pytest python-sat
      - name: Test HB loader, checkpoint và runner
        run: python -m pytest tests/sat/test_hb_loader.py tests/experiments/test_pilot_exact_p1.py tests/runner/test_checkpoint.py tests/runner/test_sat_checkpoint.py tests/runner/test_runner.py -q
